# application-prod.properties
# Spring profile ativado por SPRING_PROFILES_ACTIVE=prod
# Sobrescreve application.properties com valores de produção

# Logging — terse, sem debug
logging.level.root=WARN
logging.level.com.infoway.infofolga=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.orm.jpa=WARN

# Devtools — desabilitar (não deve estar em prod de qualquer forma)
spring.devtools.restart.enabled=false

# SQL — não logar queries em produção
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Hibernate — informações de ciclo de vida, sem verbose
spring.jpa.properties.hibernate.generate_statistics=false

# Error exposure — já em application.properties, redundante aqui mas assertivo
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Charset UTF-8 (segurança)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
