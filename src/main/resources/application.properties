server.port=${PORT:8080}

spring.jpa.open-in-view=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

api.security.token.secret=${JWT_SECRET}

# Nunca expor stack traces ou mensagens internas ao cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

logging.level.org.springframework.security=INFO
logging.level.com.infoway.infofolga=INFO

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=20000

server.tomcat.threads.max=400
server.tomcat.accept-count=200

# Cache em memória com expiração: o dashboard depende da data atual ("hoje", "últimos 30 dias")
spring.cache.cache-names=dashboard_stats
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m
