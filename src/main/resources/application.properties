server.port=${PORT:8080}
spring.jpa.open-in-view=false
# Variáveis padronizadas com o Docker Compose (SPRING_DATASOURCE_* são injetadas pelo compose)
# Fallback: valores locais para desenvolvimento sem Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/infofolga_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:infofolga_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:infofolga_pass}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
api.security.token.secret=${JWT_SECRET:jZ5fL9sQv3xG8yW2rP6dC1bA4nU0kH7mF5eJ6vO8zT=}
logging.level.org.springframework.security=DEBUG
logging.level.com.infoway.infofolga=INFO